name: Course feature
description: Propose a lesson, workflow pattern, or Learning Hub enhancement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: learner_need
    attributes:
      label: Learner need
      description: What should learners be able to explain or do afterward?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include scenario, level, lab, evaluation, failure mode, and production boundary.
    validations:
      required: true
