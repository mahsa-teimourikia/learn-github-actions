name: Validate security and reliability course

on:
  pull_request:
    paths:
      - "curriculum/advanced/01-security-and-reliability/**"
      - "tests/test_security_reliability.py"
      - ".github/workflows/validate-security-reliability-course.yml"
  push:
    branches: [main]
    paths:
      - "curriculum/advanced/01-security-and-reliability/**"
      - "tests/test_security_reliability.py"
      - ".github/workflows/validate-security-reliability-course.yml"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint release
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
      - name: Validate starter and reference workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color \
            curriculum/advanced/01-security-and-reliability/exercises/01-security-gate-starter.yml \
            curriculum/advanced/01-security-and-reliability/solutions/01-hardened-security-gate.yml

  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: curriculum/advanced/01-security-and-reliability/security-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run evaluate

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the runnable reference workflow
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: curriculum/advanced/01-security-and-reliability/solutions/01-hardened-security-gate.yml
          version: 1.30.1
          persona: regular
          online-audits: false
          advanced-security: false
