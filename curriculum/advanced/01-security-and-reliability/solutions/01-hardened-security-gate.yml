name: Lab - hardened Actions security gate

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "curriculum/advanced/01-security-and-reliability/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "curriculum/advanced/01-security-and-reliability/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-evaluation:
    name: Threat-model regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Observe runner egress in audit mode
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install without lifecycle scripts
        working-directory: curriculum/advanced/01-security-and-reliability/security-fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run policy unit tests
        working-directory: curriculum/advanced/01-security-and-reliability/security-fixture
        run: npm test
      - name: Evaluate attack paths and negative authorization cases
        working-directory: curriculum/advanced/01-security-and-reliability/security-fixture
        run: npm run evaluate
      - name: Retain the decision evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-policy-evidence-${{ github.sha }}
          path: curriculum/advanced/01-security-and-reliability/security-fixture/reports/
          if-no-files-found: error
          retention-days: 14

  zizmor:
    name: Static workflow security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the installed workflow
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows/lab-hardened-security-gate.yml
          version: 1.30.1
          persona: regular
          online-audits: false
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency change policy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  required-security:
    name: Required security
    if: ${{ always() && !cancelled() }}
    needs: [policy-evaluation, zizmor, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce one stable branch-protection check
        env:
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.policy-evaluation.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$POLICY_RESULT" = "success"
          test "$ZIZMOR_RESULT" = "success"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_RESULT" = "success"
          else
            test "$DEPENDENCY_RESULT" = "skipped"
          fi
