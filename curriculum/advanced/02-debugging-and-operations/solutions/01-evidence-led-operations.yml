name: Lab - evidence-led maintenance operations

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      failure_mode:
        description: Select a deterministic incident scenario
        required: true
        type: choice
        options: [none, deterministic, transient-before-write, transient-after-write, flaky]
        default: none

permissions:
  contents: read

concurrency:
  group: maintenance-lab
  cancel-in-progress: false

jobs:
  operate:
    name: Operate and preserve evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install and test the maintenance fixture
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Capture safe run identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          {
            echo "## Run identity"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | $EVENT_NAME |"
            echo "| Run / attempt | $RUN_ID / $RUN_ATTEMPT |"
            echo "| Source SHA | $SOURCE_SHA |"
            echo "| Workflow ref | $WORKFLOW_REF |"
            echo "| Actor ID | $ACTOR_ID |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attempt maintenance once
        id: operation
        continue-on-error: true
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        env:
          FAILURE_MODE: ${{ inputs.failure_mode || 'none' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IDEMPOTENCY_KEY: maintenance:${{ github.run_id }}
        run: npm run operate
      - name: Reconcile an ambiguous or failed result
        id: reconcile
        if: ${{ steps.operation.outcome == 'failure' }}
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        run: npm run reconcile
      - name: Retry only a proven pre-write failure
        id: retry
        if: ${{ steps.reconcile.outputs.safe_to_retry == 'true' }}
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        env:
          FAILURE_MODE: none
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IDEMPOTENCY_KEY: maintenance:${{ github.run_id }}
          REPORT_NAME: retry-operation.json
        run: npm run operate
      - name: Classify the terminal state
        id: decision
        if: ${{ always() && !cancelled() }}
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        run: npm run classify
      - name: Retain operation and recovery evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: curriculum/advanced/02-debugging-and-operations/operations-fixture/reports/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce the classified outcome
        if: ${{ always() && !cancelled() }}
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        run: npm run enforce

  analyze:
    name: Analyze run and historical signals
    if: ${{ always() && !cancelled() }}
    needs: operate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maintenance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: curriculum/advanced/02-debugging-and-operations/operations-fixture/reports/current-run/
      - name: Compute SLIs and reconstruct the incident timeline
        working-directory: curriculum/advanced/02-debugging-and-operations/operations-fixture
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run evaluate
      - name: Retain the operations analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operations-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: curriculum/advanced/02-debugging-and-operations/operations-fixture/reports/
          if-no-files-found: error
          retention-days: 14

  required-operations:
    name: Required operations
    if: ${{ always() && !cancelled() }}
    needs: [operate, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on operation or evidence loss
        env:
          OPERATE_RESULT: ${{ needs.operate.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          test "$OPERATE_RESULT" = "success"
          test "$ANALYZE_RESULT" = "success"
