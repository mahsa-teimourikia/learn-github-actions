name: Actionlint repair reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [20, 22]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Keep event data outside generated shell source
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || 'manual-or-push-run' }}
        run: printf '%s\n' "$ISSUE_TITLE"

  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "package after validated build"
